
modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[mixins]]
    config = "${mod_id}-common.mixins.json"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "icon.png"
    authors = "${mod_authors}"
    credits = "${mod_credits}"
    description = '''${mod_description}'''
    modUrl = "${mod_homepage}"
    updateJSONURL = "${update_url}"
    #itemIcon = "mekarobotics" #catalogue icon

[[dependencies.mekarobotics]]
    modId="minecraft"
    mandatory=true
    versionRange = "${minecraft_version}"
    side="BOTH"
[[dependencies.mekarobotics]]
    modId="neoforge"
    mandatory=true
    versionRange="${neo_version_range}"
    side="BOTH"
[[dependencies.mekarobotics]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version}"
    side="BOTH"
[[dependencies.mekarobotics]]
    modId="computercraft"
    mandatory=false
    versionRange="${cct_version}"
    ordering="NONE"
    side="BOTH"
[[dependencies.mekarobotics]]
    modId="mekanism"
    mandatory=true
    versionRange="${mekanism_version_range}"
    ordering="AFTER"
    side="BOTH"
[[dependencies.mekarobotics]]
    modId="mekanismgenerators"
    mandatory=true
    versionRange="${mekanism_version_range}"
    ordering="AFTER"
    side="BOTH"
