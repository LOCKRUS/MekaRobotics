plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

base {
    archivesName = mod_id + '-' + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDirs = ['forge/src/main/java']
        java.exclude 'com/io/mekarobotics/integration/cc/RedstoneIntegrator.java'
        java.exclude 'com/io/mekarobotics/integration/cc/RedstoneInterface.java'
        java.exclude 'com/io/mekarobotics/datagen/**'
        java.exclude 'com/io/mekarobotics/common/content/recipes/AssemblerRecipeBuilder.java'
        java.exclude 'com/io/mekarobotics/common/content/recipes/WireCutterRecipeBuilder.java'
        java.exclude 'com/io/mekarobotics/test/**'
        java.exclude 'com/io/mekarobotics/integration/config/RoboticsModConfig.java'
        java.exclude 'com/io/mekarobotics/integration/cc/ComputerCapability.java'
        java.exclude 'com/io/mekarobotics/integration/cc/ComputerizedBehavior.java'
        java.exclude 'com/io/mekarobotics/integration/cc/EntityComputer.java'
        java.exclude 'com/io/mekarobotics/integration/cc/IComputerized.java'
        java.exclude 'com/io/mekarobotics/integration/cc/ProgrammingMenu.java'
        java.exclude 'com/io/mekarobotics/integration/cc/ProgrammingScreen.java'
        java.exclude 'com/io/mekarobotics/integration/cc/vanilla/**'
        java.exclude 'com/io/mekarobotics/integration/cc/apis/**'
        java.exclude 'com/io/mekarobotics/mixins/EntityInventory.java'
        resources.srcDirs = [
                'common/src/main/resources',
                'forge/src/main/resources',
                'forge/src/generated'
        ]
    }
}

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('forge/src/generated').absolutePath, '--existing', file('forge/src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_github: mod_github,
            mod_homepage: mod_homepage,
            mod_credits: mod_credits
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.exclude 'META-INF/mods.toml'

// Mekanism is the primary platform integration for this branch.
dependencies {
    implementation 'mekanism:Mekanism:1.21.1-10.7.14.79'
    implementation 'mekanism:Mekanism:1.21.1-10.7.14.79:generators'
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.3'
    implementation files('vendor/caliko-1.3.8.jar')
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    localRuntime 'mekanism:Mekanism:1.21.1-10.7.14.79'
    localRuntime 'mekanism:Mekanism:1.21.1-10.7.14.79:generators'
}

// Caliko is a library, not a NeoForge mod. Bundle it into MekaRobotics so it
// must not be placed separately in the user's mods directory.
tasks.named('jar', Jar).configure {
    from sourceSets.main.output
    from {
        zipTree(file('vendor/caliko-1.3.8.jar')).matching {
            exclude 'META-INF/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
